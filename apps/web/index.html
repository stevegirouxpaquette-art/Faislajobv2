<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      .client-live-tracker,
      #client-mission-upgrade,
      .cl-up{display:none!important}
    </style>
    <title>FaisLaJob</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (()=>{
        const removeLegacyMissionCard=()=>{
          document.querySelectorAll('#client-mission-upgrade,.cl-up').forEach(el=>el.remove());
        };
        removeLegacyMissionCard();
        new MutationObserver(removeLegacyMissionCard).observe(document.documentElement,{subtree:true,childList:true});

        if(!location.pathname.startsWith('/request')) return;
        const nativeFetch=window.fetch.bind(window);
        window.fetch=async(input,init)=>{
          const url=typeof input==='string'?input:(input&&input.url)||'';
          const method=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
          if(method==='GET' && /\/api\/missions\/[^/?]+(?:\?|$)/.test(url) && !/\/billing(?:\?|$)/.test(url)){
            return new Response('{}',{status:404,headers:{'Content-Type':'application/json'}});
          }
          return nativeFetch(input,init);
        };
      })();
    </script>
    <script type="module" src="/src/stability.ts?v=8"></script>
    <script type="module" src="/src/mission-redirect.ts?v=8"></script>
    <script type="module" src="/src/main.tsx?v=8"></script>
    <script type="module" src="/src/client-active-card.ts?v=8"></script>
    <script type="module" src="/src/completion-flow.ts?v=8"></script>
  </body>
</html>
